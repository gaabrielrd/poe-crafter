version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # O ecossistema npm do Dependabot compreende o pnpm-lock.yaml e os
      # manifestos de todos os workspaces declarados na raiz.
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
